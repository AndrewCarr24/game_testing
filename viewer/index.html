<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1f22; overflow: hidden; font: 13px system-ui, sans-serif; color: #ccc; }
    #hud { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 6px; }
    #hud a { color: #9cf; margin-right: 8px; }
    #hint { position: absolute; bottom: 14px; width: 100%; text-align: center; color: #eee; text-shadow: 0 1px 3px #000; white-space: pre; }
    #toast { position: absolute; top: 38%; width: 100%; text-align: center; font-size: 17px; color: #fff;
             text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity .25s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #inventory { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 8px; }
    .slot { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.18);
            border-radius: 6px; padding: 6px 10px; color: #eee; }
    .slot .card { width: 22px; height: 14px; border-radius: 2px; background: linear-gradient(90deg, #e9e9e6 72%, #1846a8 72%); }
    .slot .glass { width: 12px; height: 18px; border-radius: 4px 4px 3px 3px; background: linear-gradient(180deg, rgba(190,200,200,.5), rgba(120,115,110,.8)); }
    .slot.armed { border-color: #f0c674; box-shadow: 0 0 0 1px #f0c674 inset; }
    .slot .tag { font-size: 10px; letter-spacing: .08em; color: #f0c674; }
    #inv-panel { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,12,14,.55); }
    #inv-panel.open { display: flex; }
    #inv-panel .box { min-width: 320px; background: rgba(20,22,25,.92); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 18px 20px; }
    #inv-panel h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .14em; color: #aaa; font-weight: 600; }
    #inv-panel .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px; color: #ddd; font-size: 15px; }
    #inv-panel .row.sel { background: rgba(240,198,116,.16); color: #fff; outline: 1px solid rgba(240,198,116,.6); }
    #inv-panel .row .tag { margin-left: auto; font-size: 11px; color: #f0c674; letter-spacing: .08em; }
    #inv-panel .empty { color: #888; padding: 8px 2px; }
    #inv-panel .help { margin-top: 14px; font-size: 12px; color: #999; }
    /* flashlight battery meter */
    #battery { position: absolute; right: 14px; bottom: 56px; display: none; align-items: center; gap: 6px; font-size: 10px;
               letter-spacing: .1em; color: #ddd; text-shadow: 0 1px 2px #000; }
    #battery.show { display: flex; }
    #battery .cell { width: 54px; height: 9px; border: 1px solid rgba(255,255,255,.6); border-radius: 2px; padding: 1px; background: rgba(0,0,0,.4); }
    #battery .cell i { display: block; height: 100%; background: #e9e4cf; border-radius: 1px; }
    #battery.low .cell i { background: #e0533a; }
    #battery.on span { color: #f0c674; }
    /* smart-home tablet */
    #tablet { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,12,14,.45); }
    #tablet.open { display: flex; }
    #tablet .tbox { width: 700px; max-width: calc(100% - 32px); background: #101214; border: 10px solid #050505; border-radius: 22px;
                    box-shadow: 0 0 0 1px #333, 0 20px 60px rgba(0,0,0,.6); padding: 14px 18px; color: #d8dde2; }
    #tablet .thead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    #tablet .ttitle { font-weight: 700; letter-spacing: .2em; font-size: 12px; color: #8fb8d8; margin-right: 10px; }
    #tablet .ttab { padding: 4px 12px; border-radius: 12px; font-size: 13px; color: #9aa3ab; }
    #tablet .ttab.on { background: rgba(143,184,216,.18); color: #fff; }
    #tablet .ttab.sel { outline: 1px solid #8fb8d8; }
    #tablet .tstat { margin-left: auto; font-size: 10px; letter-spacing: .14em; color: #7c8; }
    #tablet .tlist { max-height: 380px; overflow: hidden; }
    #tablet .trow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 14px; }
    #tablet .trow.sel { background: rgba(143,184,216,.12); }
    #tablet .trow.live { color: #fff; }
    #tablet .troom { flex: 1; }
    #tablet .tcell { width: 130px; font-size: 12px; color: #9aa3ab; padding: 3px 8px; border-radius: 4px; }
    #tablet .tcell b { color: #ccd; font-weight: 600; }
    #tablet .tcell.lit b { color: #f0c674; }
    #tablet .tcell.sel { outline: 1px solid #8fb8d8; color: #fff; }
    #tablet .tcams { display: flex; gap: 14px; }
    #tablet .tcams .tlist { flex: 1; }
    #tablet .tfeed { position: relative; width: 400px; height: 225px; background: #050607; border-radius: 4px; overflow: hidden; flex: none; }
    #tablet .tfeed canvas { width: 100%; height: 100%; display: block; filter: grayscale(.8) contrast(1.15) brightness(1.05); }
    #tablet .tfeed::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
    #tablet .tlabel { position: absolute; left: 8px; top: 6px; font: 11px ui-monospace, monospace; color: #e8e8e8; text-shadow: 0 1px 2px #000; z-index: 1; }
    #tablet .tover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 14px ui-monospace, monospace; letter-spacing: .3em; color: #888; z-index: 1; }
    #tablet .tmsg { min-height: 18px; margin-top: 10px; font-size: 12px; color: #f0c674; }
    #tablet .thelp { font-size: 11px; color: #7d858c; margin-top: 4px; }
    #tablet .tempty { color: #888; padding: 10px; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="hud">
    <a href="?level=mansion">mansion</a>
    <a href="?asset=lounge_chair">lounge_chair</a>
    <a href="?asset=desk_chair">desk_chair</a>
    <a href="?asset=desk">desk</a>
    <a href="?asset=coffee_table">coffee_table</a>
    <a href="?asset=rug">rug</a>
    <span id="stats"></span>
  </div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="inventory"></div>
  <div id="battery"><span>LIGHT</span><div class="cell"><i></i></div></div>
  <div id="tablet"></div>
  <div id="inv-panel"><div class="box"><h2>INVENTORY</h2><div id="inv-list"></div>
    <div class="help">↑ ↓ · choose &nbsp;&nbsp; Enter · arm &nbsp;&nbsp; I · close</div></div></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
    import { Interactables, Inventory } from './interactables.js';
    import { loadBake } from './baked.js';
    import { Player, KEYS } from './player.js';
    import { Hand, Throwables, Flashlight } from './items.js';
    import { Signals, Noise } from './signals.js';
    import { Tablet } from './tablet.js';
    import { batchRooms, RoomCuller } from './batching.js';
    import { loadSky, applyOutdoor } from './sky.js';
    import { Fire } from './fire.js';
    import { createFx, governor } from './fx.js';
    import { Grimble, prepareGrimble } from './grimble.js';
    import { GrimbleHunt, shatter } from './grimble_hunt.js';

    const params = new URLSearchParams(location.search);
    const stats = document.getElementById('stats');
    const hint = document.getElementById('hint');

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    // cap the render resolution: retina screens would otherwise draw 4x the pixels
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    // Tone mapping (?tm=neutral|agx|aces). Neutral = Khronos PBR Neutral (three.js ships it
    // from r162; here it's the custom slot): true base colours, gentle highlight roll-off, and
    // the cheapest of the three. Tone mapping runs in every material's shader, per pixel drawn.
    THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment.replace(
      'vec3 CustomToneMapping( vec3 color ) { return color; }', `vec3 CustomToneMapping( vec3 color ) {
        const float StartCompression = 0.8 - 0.04;
        const float Desaturation = 0.15;
        color *= toneMappingExposure;
        float x = min( color.r, min( color.g, color.b ) );
        float offset = x < 0.08 ? x - 6.25 * x * x : 0.04;
        color -= offset;
        float peak = max( color.r, max( color.g, color.b ) );
        if ( peak < StartCompression ) return color;
        float d = 1.0 - StartCompression;
        float newPeak = 1.0 - d * d / ( peak + d - StartCompression );
        color *= newPeak / peak;
        float g = 1.0 - 1.0 / ( Desaturation * ( peak - newPeak ) + 1.0 );
        return mix( color, vec3( newPeak ), g );
      }`);
    const TONE = { neutral: THREE.CustomToneMapping, agx: THREE.AgXToneMapping, aces: THREE.ACESFilmicToneMapping };
    renderer.toneMapping = TONE[params.get('tm')] ?? THREE.CustomToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // nothing casts moving shadows except interactables, so only redraw shadows on demand
    renderer.shadowMap.autoUpdate = false;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const envMap = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = envMap;
    // near plane 10 cm, not 1 cm: depth precision scales with it, and at 1 cm a picture's canvas
    // and its backing 3.5 mm behind z-fought (flickered) from ~20 m away. 10 cm is still nearer
    // than anything can get to the eye (held item ~0.4 m, walls >= 0.25 m, head clearance 0.15 m).
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    const loader = new GLTFLoader();
    // assets are exported with Draco-compressed geometry
    loader.setDRACOLoader(new DRACOLoader().setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/'));
    const loadGltf = (url) => new Promise((ok, fail) => loader.load(url, ok, undefined, fail));

    // assets that use the same image (e.g. walnut) share one GPU texture
    const textureCache = new Map();
    const ANISOTROPY = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    function shareTextures(m) {
      for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap']) {
        const t = m[k];
        if (!t || !t.name) continue;
        const key = `${t.name}:${t.image?.width}x${t.image?.height}`;
        if (!textureCache.has(key)) {
          textureCache.set(key, t);
          // floors seen at a grazing angle stay sharp instead of smearing; the wall plaster's
          // fine, low-contrast grain doesn't need it (and walls are a lot of pixels)
          t.anisotropy = t.name.includes('Plaster') ? 1 : ANISOTROPY;
        } else if (textureCache.get(key) !== t) { t.dispose(); m[k] = textureCache.get(key); }
      }
    }

    // Each prop file carries its own copy of the shared materials (M_Bronze, M_Walnut, ...);
    // the batcher merges per material object, so identical copies are folded into one here:
    // reusing a material across assets then really costs no extra draw call in a room.
    const materialCache = new Map();
    const hex = (c) => (c ? c.getHexString() : '-');
    function shareMaterial(m) {
      if (Array.isArray(m)) return m;
      const maps = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap']
        .map((k) => m[k]?.uuid ?? '-').join(',');
      const key = [m.type, m.name, hex(m.color), hex(m.emissive), m.emissiveIntensity, m.roughness, m.metalness,
        m.opacity, m.transparent, m.alphaTest, m.side, m.vertexColors, m.transmission, maps].join('|');
      if (!materialCache.has(key)) materialCache.set(key, m);
      return materialCache.get(key);
    }

    function prepare(root, envIntensity = 1, share = false) {
      let tris = 0, meshes = 0;
      root.traverse((o) => {
        if (!o.isMesh) return;
        meshes++;
        shareTextures(o.material);
        if (share) o.material = shareMaterial(o.material);
        tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
        const m = o.material;
        m.envMapIntensity = envIntensity;
        if (m.transparent) { o.castShadow = false; o.receiveShadow = false; m.depthWrite = false; }
        else { o.castShadow = o.receiveShadow = true; }
      });
      return { tris, meshes };
    }

    let update = () => {};
    window.__camera = camera;
    window.__three = { renderer, scene, camera };

    // ------------------------------------------------------------ single asset
    async function viewAsset(name) {
      scene.background = new THREE.Color(0x1d1f22);
      camera.fov = 40; camera.updateProjectionMatrix();
      camera.position.set(1.4, 1.1, 1.8);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.4, 0);
      controls.enableDamping = true;
      update = () => controls.update();

      const sun = new THREE.DirectionalLight(0xffffff, 2.0);
      sun.position.set(2, 4, 3);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 });
      sun.shadow.bias = -0.0005;
      scene.add(sun);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20),
        new THREE.MeshStandardMaterial({ color: 0x8a8580, roughness: 0.9 }));
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const gltf = await loadGltf(`../assets/models/${name}.gltf`);
      const { tris, meshes } = prepare(gltf.scene);
      scene.add(gltf.scene);
      const size = new THREE.Box3().setFromObject(gltf.scene).getSize(new THREE.Vector3());
      stats.textContent = `${meshes} meshes · ${Math.round(tris)} tris · ${size.x.toFixed(2)}×${size.z.toFixed(2)}×${size.y.toFixed(2)} m`;
    }

    // ------------------------------------------------------------ level
    async function viewLevel(name) {
      const base = '../assets/';
      const level = await (await fetch(`${base}levels/${name}.json`)).json();
      window.__level = level;
      // signals (switches, `use` points, the tablet, power) and noise (thrown things landing,
      // what the Grimble hears): prompts/interactivity.md, viewer/signals.js
      const signals = new Signals(level.signals || {});
      const noise = new Noise();
      window.__signals = signals;
      window.__noise = noise;
      scene.background = new THREE.Color(0xb9cde3);
      RectAreaLightUniformsLib.init();

      // baked lighting replaces the stand-in fill lights; the sun stays real-time
      const baked = params.get('bake') === '0' ? null : await loadBake(base, name, renderer, level.rooms, params.get('box') !== '0', params.get('so') !== '0', params.get('sheen') !== '0');
      if (baked) {
        scene.environment = baked.defaultEnv;
        renderer.toneMappingExposure = baked.bake.exposure;
      }
      // the view out of the windows: procedural sky + horizon panorama (blender/levels/horizon.py)
      const sky = await loadSky(`${base}levels/${name}_sky.json`, renderer);
      if (sky) scene.add(sky.dome);
      const env = level.lights.find((l) => l.type === 'ambient_env');
      const envIntensity = baked ? 1 : env ? env.intensity : 1;
      for (const l of level.lights) {
        if (baked && l.type !== 'sun') continue;
        // a real-time area light per ceiling strip is far too slow for a whole house
        // (every material pays for every light); unbaked, the hemisphere + environment stand in
        if (l.type === 'rect') continue;
        if (l.type === 'rect') {
          const light = new THREE.RectAreaLight(new THREE.Color(...l.color), l.intensity, l.width, l.height);
          light.position.set(...l.position);
          light.lookAt(...l.lookAt);
          scene.add(light);
        } else if (l.type === 'hemisphere') {
          scene.add(new THREE.HemisphereLight(new THREE.Color(...l.sky), new THREE.Color(...l.ground), l.intensity));
        } else if (l.type === 'sun') {
          const sun = new THREE.DirectionalLight(new THREE.Color(...l.color), l.intensity);
          const dir = new THREE.Vector3(...l.direction).normalize();
          // the shadow must cover the whole level: walls and ceilings are what keep the
          // sun out of interior rooms, so a prop outside the shadow box is lit as if outdoors
          const bounds = new THREE.Box3();
          for (const c of level.colliders) bounds.union(new THREE.Box3(new THREE.Vector3(...c.min), new THREE.Vector3(...c.max)));
          const centre = bounds.getCenter(new THREE.Vector3());
          const radius = bounds.getSize(new THREE.Vector3()).length() / 2;
          sun.target.position.copy(centre);
          sun.position.copy(centre).addScaledVector(dir, -(radius + 5));
          sun.castShadow = true;
          sun.shadow.mapSize.set(2048, 2048);
          Object.assign(sun.shadow.camera, { left: -radius, right: radius, top: radius, bottom: -radius, near: 1, far: 2 * radius + 10 });
          sun.shadow.bias = -0.0004;
          sun.shadow.normalBias = 0.02;
          scene.add(sun, sun.target);
        }
      }

      // load each asset once, clone per placement (geometry + materials shared)
      const names = [...new Set(level.props.map((p) => p.asset))];
      const outdoorLoad = level.outdoor && sky ? loadGltf(base + level.outdoor) : null;
      // the walkable grounds' colliders (blender/levels/ground_colliders.py): ?outside=0 leaves them out
      const groundsLoad = level.grounds?.file && params.get('outside') !== '0'
        ? fetch(base + level.grounds.file).then((r) => (r.ok ? r.json() : null)).catch(() => null) : null;
      const [shell, ...protos] = await Promise.all(
        [level.shell, ...names.map((n) => level.assets[n].file)].map((f) => loadGltf(base + f)));
      let total = prepare(shell.scene, envIntensity).tris;
      if (baked) baked.applyLightmaps(shell.scene);
      scene.add(shell.scene);
      // the grounds: lawn, terrace, hedge and the outdoor zones, lighting baked into vertex colours
      if (outdoorLoad) {
        const outdoor = await outdoorLoad;
        total += prepare(outdoor.scene).tris;
        applyOutdoor(outdoor.scene, sky, baked?.bake.outdoor);
        scene.add(outdoor.scene);
      }
      // the Grimble (viewer/grimble.js): walks in from the west after a short delay; ?grimble=0
      // leaves it out, ?grimble=x,z[,rotY,y] just stands it there (for screenshots)
      let grimble = null;
      if (params.get('grimble') !== '0') {
        const gltf = await loadGltf(base + 'models/grimble.gltf');
        const envMap = sky ? sky.getEnv() : scene.environment;
        if (params.get('grimble')) {
          const [gx, gz, gr = 90, gy = -0.08] = params.get('grimble').split(',').map(Number);
          gltf.scene.position.set(gx, gy, gz);
          gltf.scene.rotation.y = THREE.MathUtils.degToRad(gr);
          prepareGrimble(gltf.scene, envMap, base + 'models/');
          scene.add(gltf.scene);
        } else {
          // west garden (glTF x = west): from the lawn's far edge over the hedge (x -70) and down
          // the pool's south walk (off the axis, so the sculpture never hides it), then square on
          // to the great room glass
          grimble = new Grimble(scene, gltf, {
            route: [[-88, -4.4], [-35, -4.4], [-33, 0], [-26.1, 0]],
            ground: (x) => (x > -31.5 ? 0.0 : -0.08),
            envMap,
            opts: { base: base + 'models/', ...(params.get('gdelay') ? { delay: +params.get('gdelay') } : {}) },
          });
        }
      }
      const proto = Object.fromEntries(names.map((n, i) => [n, protos[i].scene]));
      for (const n of names) prepare(proto[n], envIntensity, true);

      const colliders = level.colliders.map((c) => new THREE.Box3(new THREE.Vector3(...c.min), new THREE.Vector3(...c.max)));
      window.__colliders = colliders;
      const walls = colliders.slice();   // the shell's boxes (props add theirs below)
      // ---- going outside: the grounds (lawn, terrace, hedge, the zones' furniture, water blockers).
      // Thousands of static boxes: `fixed` puts them in the player's broadphase grid; `seeThrough`
      // ones (the boundary, water) don't block a sight line
      {
        const g = groundsLoad && await groundsLoad;
        const see = new Set(level.grounds?.seeThrough || []);
        for (const [kind, list] of Object.entries(g || {})) for (const b of list) {
          const box = new THREE.Box3(new THREE.Vector3(b[0], b[1], b[2]), new THREE.Vector3(b[3], b[4], b[5]));
          box.fixed = true;
          box.kind = kind;
          if (see.has(kind)) box.seeThrough = true;
          colliders.push(box);
        }
      }
      const inventoryEl = document.getElementById('inventory');
      const invPanel = document.getElementById('inv-panel');
      const invList = document.getElementById('inv-list');
      const icon = (id) => (id === 'keycard' ? '<span class="card"></span>' : id === 'vase' ? '<span class="glass"></span>' : '');
      let flashlight = null;
      const inventory = new Inventory((inv) => {
        if (flashlight && inv.has('flashlight')) flashlight.ensure();
        inventoryEl.innerHTML = [...inv.items].map(([id, it]) =>
          `<div class="slot${inv.armed === id ? ' armed' : ''}">${icon(id)}${inv.label(id)}${inv.armed === id ? ' <span class="tag">ARMED</span>' : ''}</div>`).join('');
        invPanel.classList.toggle('open', inv.open);
        invList.innerHTML = inv.items.size
          ? inv.ids().map((id, i) => `<div class="row${i === inv.sel ? ' sel' : ''}">${icon(id)}${inv.label(id)}${inv.armed === id ? '<span class="tag">ARMED</span>' : ''}</div>`).join('')
          : '<div class="empty">Nothing yet.</div>';
        hand?.show(inv.armed, inv.armed && inv.get(inv.armed).node);
      });
      let hand = null;
      const interact = new Interactables(inventory, colliders, signals, scene);
      interact.walls = walls;            // (a switch behind a wall isn't in reach)
      window.__interact = interact;
      window.__inventory = inventory;
      const fire = new Fire();
      const placed = {};   // asset -> first placed object, for attachments
      const roomRoots = {};   // room -> placed prop roots (for batching and culling)
      // doors (a swinging part) belong to both rooms they join: drawn when either one is
      const shared = [];
      const roomsAt = ([x, y, z]) => Object.entries(level.rooms).filter(([, r]) =>
        y >= r.floor - 0.1 && y <= r.floor + r.height && x >= r.rect[0] - 0.4 && x <= r.rect[2] + 0.4 &&
        z >= r.rect[1] - 0.4 && z <= r.rect[3] + 0.4).map(([name]) => name);
      // the room on the other side of a door placed in `p.room`'s wall, and the leaf's normal
      // pointing into it (assets face +z in glTF; the closed leaf lies in the wall)
      const acrossDoor = (p) => {
        const a = THREE.MathUtils.degToRad(p.rotationY), r = level.rooms[p.room];
        const axis = new THREE.Vector3(Math.sin(a), 0, Math.cos(a));
        const [x, y, z] = p.position;
        if (r && ((r.rect[0] + r.rect[2]) / 2 - x) * axis.x + ((r.rect[1] + r.rect[3]) / 2 - z) * axis.z > 0) axis.negate();
        const qx = x + axis.x * 0.6, qy = y + 1.0, qz = z + axis.z * 0.6;
        const other = Object.entries(level.rooms).find(([n, o]) => n !== p.room && qy >= o.floor && qy <= o.floor + o.height &&
          qx >= o.rect[0] && qx <= o.rect[2] && qz >= o.rect[1] && qz <= o.rect[3]);
        return other ? { room: other[0], axis } : null;
      };
      for (const p of level.props) {
        const obj = proto[p.asset].clone(true);
        obj.position.set(...p.position);
        obj.rotation.y = THREE.MathUtils.degToRad(p.rotationY);
        // (a door asset; an appliance with a swinging door, e.g. the kitchen wall run, stays in its room)
        let door = false;
        if (!p.attach && /(^|_)door/.test(p.asset)) obj.traverse((o) => { if (o.userData.interact?.type === 'rotate') door = true; });
        const across = door && params.get('door2') !== '0' && acrossDoor(p);   // (?door2=0: own room only, to compare)
        if (baked && across) {
          // lit from both rooms (each face by the room it faces); real-time sun if either room gets it
          baked.applyDoor(obj, p.room, across.room, across.axis, level.rooms[p.room]?.sun === false && level.rooms[across.room]?.sun === false);
        } else if (baked) baked.applyRoom(obj, p.room, level.rooms[p.room]?.sun === false);
        fire.collect(obj);
        if (p.attach) {
          // e.g. the keycard rides inside the desk drawer
          placed[p.attach.asset].getObjectByName(p.attach.node).add(obj);
          interact.collect(obj, { lock: p.lock, signal: p.signal, state: p.state });
          total += level.assets[p.asset].tris;
          continue;
        }
        scene.add(obj);
        placed[p.asset] ??= obj;
        obj.updateMatrixWorld(true);
        interact.collect(obj, { lock: p.lock, signal: p.signal, state: p.state });
        if (door) shared.push({ obj, rooms: roomsAt(p.position) });
        else (roomRoots[p.room] ??= []).push(obj);
        total += level.assets[p.asset].tris;
        // one box per part (seat, desktop, ...) so the player can stand on them
        const a = level.assets[p.asset];
        for (const c of a.colliders || [a.aabb])
          colliders.push(new THREE.Box3(new THREE.Vector3(...c.min), new THREE.Vector3(...c.max)).applyMatrix4(obj.matrixWorld));
      }
      interact.snapAll();      // a later placement's `state` may have set a signal earlier props use
      // merge each room's static furniture, then draw only rooms near the player
      const moving = new Set();
      for (const it of interact.items) it.node.traverse((o) => moving.add(o));
      // reactors that move (blinds, rockers' parts, doors) or carry a light keep their own nodes; the
      // ones that only change materials (glows, screens) batch per room: their shared materials do it
      for (const r of interact.reactors) if (r.moves || params.get('rbatch') === '0') r.node.traverse((o) => moving.add(o));   // (?rbatch=0: compare)
      for (const s of shared) s.obj.traverse((o) => moving.add(o));   // (not merged into one room's batch)
      const { batches, before, after } = batchRooms(roomRoots, moving);
      for (const list of Object.values(batches)) for (const m of list) scene.add(m);
      const culler = new RoomCuller(level, roomRoots, batches, { shared });
      window.__culler = culler;
      // rugs and wall art are drawn with the shell (they borrow its lightmap) but are furniture:
      // cull them with their room's props, and keep them out of the sun's shadow pass
      {
        const rooms = Object.keys(level.rooms).sort((a, b) => b.length - a.length);
        shell.scene.traverse((o) => {
          if (!o.isMesh || !/_(Art|Rug)$/.test(o.name)) return;
          o.castShadow = false;
          const room = rooms.find((r) => o.name.startsWith(`Mansion_${r}_`));
          culler.rooms.find((r) => r.name === room)?.objects.push(o);
        });
      }
      stats.textContent = `${level.props.length} props · ${Math.round(total)} tris · ${colliders.length} colliders · ${before}→${after} meshes`;

      camera.fov = 65; camera.updateProjectionMatrix();
      // ?pos=x,y,z&look=x,y,z overrides the spawn view (pos is eye position; handy for screenshots)
      const vec = (k, d) => (params.get(k) ? params.get(k).split(',').map(Number) : d);
      const eyePos = vec('pos', level.spawn.position);
      camera.position.set(...eyePos);
      camera.lookAt(...vec('look', level.spawn.lookAt));
      const player = new Player(camera, colliders, [eyePos[0], eyePos[1] - 1.65, eyePos[2]], { ramps: level.ramps });
      window.__player = window.__player || player;
      // inside: after a few rounds at the glass it breaks in and hunts (viewer/grimble_hunt.js);
      // ?hunt=0 keeps it outside
      let shatterFx = null;
      if (grimble && params.get('hunt') !== '0') {
        grimble.playerObj = player;
        grimble.hunt = new GrimbleHunt(grimble, {
          level, colliders, scene,
          sightBlockers: () => (interact.sightBlockers ? interact.sightBlockers() : []),
          opts: params.get('hunt') === 'now' ? { loopsBeforeSmash: 0 } : {},
        });
        grimble.hunt.onBreak = () => { const b = level.breakables?.[0]; if (b) shatterFx = shatter(scene, b); renderer.shadowMap.needsUpdate = true; };
      }
      window.__player = player;
      scene.add(camera);                       // so the held item (a child of the camera) renders
      hand = new Hand(camera);
      const throwables = new Throwables(scene, colliders, (at, n) => {
        if (!n.thud) toast('Smash!');
        noise.emit({ position: at.clone(), loudness: n.loudness, source: n.thud ? 'thud' : 'shatter', item: n.item });
      }, (obj) => { interact.register(obj); renderer.shadowMap.needsUpdate = true; });   // a book that landed can be taken again
      window.__throwables = throwables;
      flashlight = new Flashlight(camera);
      window.__flashlight = flashlight;
      // the spot light is made up front when the level has a flashlight: adding a light later
      // recompiles every material in the house
      if (inventory.has('flashlight') || interact.items.some((i) => i.def.item === 'flashlight')) flashlight.ensure();
      const batteryEl = document.getElementById('battery');
      const tablet = new Tablet({ renderer, scene, camera, level, signals, culler, hide: [hand.group], el: document.getElementById('tablet') });
      window.__tablet = tablet;

      const controls = new PointerLockControls(camera, document.body);
      const walkHint = 'click to play · WASD move · Shift run · Space jump · C crouch · I inventory · Esc release';
      hint.textContent = walkHint;
      document.body.addEventListener('click', () => controls.lock());
      const keys = {};
      let focus = null;   // interactable the player can use right now
      addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        if (!controls.isLocked || e.repeat) return;
        if (player.isDown) return;                       // knocked down: nothing until they're up
        if (tablet.open) { tablet.key(e.code); return; } // the tablet takes the keys while it's open
        if (e.code === 'KeyI') { inventory.toggle(); if (inventory.open) frozenLook.copy(camera.quaternion); return; }
        // with the inventory open, the up/down arrows step through it (movement is paused then)
        if (inventory.open && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
          inventory.move(e.code === 'ArrowDown' ? 1 : -1);
          return;
        }
        if (e.code === 'Enter' || e.code === 'NumpadEnter') {
          if (inventory.open) {
            const id = inventory.armSelected();
            if (id) toast(`Armed: ${inventory.name(id)} · Enter to use · Delete to put away`);
          } else if (inventory.armed) useArmed();
          return;
        }
        // Mac keyboards send Backspace for the key labelled "delete"
        if ((e.code === 'Delete' || e.code === 'Backspace') && inventory.armed) {
          e.preventDefault();
          toast(`${inventory.name(inventory.holster())} put away`);
          return;
        }
        if (e.code === 'KeyE' && focus && !inventory.open) {
          const msg = interact.use(focus, player.boxAt(player.pos).clone());
          if (msg) toast(msg);
          renderer.shadowMap.needsUpdate = true;
        }
      });
      const frozenLook = new THREE.Quaternion();

      function useArmed() {
        const id = inventory.armed;
        const entry = inventory.get(id);
        if (entry.def.throwable) {
          const dir = new THREE.Vector3();
          camera.getWorldDirection(dir);
          const origin = camera.position.clone().addScaledVector(dir, 0.45).add(new THREE.Vector3(0, -0.15, 0));
          throwables.throw(entry.node, origin, dir, entry.def);
          inventory.remove(id);
          return;
        }
        // a `use` point that needs it (fuse box, car) or a lock it fits, in reach
        const msg = interact.useItem(id, camera.position);
        if (msg) { toast(msg); renderer.shadowMap.needsUpdate = true; return; }
        if (id === 'flashlight') return toggleFlashlight();
        if (id === 'battery') return loadBattery();
        if (id === 'tablet') { if (tablet.show()) frozenLook.copy(camera.quaternion); return; }
        toast(interact.useKey(id, camera.position));      // "Nothing to use the ... on here"
      }
      function toggleFlashlight() {
        if (flashlight.toggle()) return;
        if (inventory.has('battery')) { loadBattery(); flashlight.toggle(); }
        else toast('The battery is flat');
      }
      function loadBattery() {
        if (!inventory.has('flashlight')) { toast('Nothing to put the battery in'); return; }
        inventory.remove('battery');
        flashlight.refill();
        toast('New battery in the flashlight');
      }
      addEventListener('keyup', (e) => (keys[e.code] = false));
      const releaseAll = () => { for (const k in keys) keys[k] = false; };
      addEventListener('blur', releaseAll);
      controls.addEventListener('unlock', () => { releaseAll(); if (inventory.open) inventory.toggle(); tablet.close(); });
      const held = (names) => names.some((k) => keys[k]);
      const toastEl = document.getElementById('toast');
      let toastTimer;
      const toast = (msg) => {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
      };
      window.__toast = () => toastEl.textContent;

      const clock = new THREE.Clock();
      const viewDir = new THREE.Vector3();
      update = () => {
        const dt = Math.min(clock.getDelta(), 0.05);
        const moved = interact.update(dt, camera.position);
        flashlight.update(dt);
        fire.update(dt, !!window.__bench);
        grimble?.update(dt, camera.position);
        if (shatterFx && !shatterFx(dt)) shatterFx = null;
        if (moved.length) renderer.shadowMap.needsUpdate = true;
        // a door that has just finished opening may now overlap the player: step them clear
        for (const it of moved) if (it.collider && it.t === it.target) player.pushOutOf(it.collider);
        if (throwables.update(dt)) renderer.shadowMap.needsUpdate = true;
        if (culler.update(camera.position, camera)) renderer.shadowMap.needsUpdate = true;
        baked?.setGlassSun(!culler.here || culler.here.name === 'courtyard');   // the sun's glint on glass only from outdoors
        tablet.update(dt);                       // the camera feed (~5 fps, while that page is open)
        // the inventory screen and the tablet pause looking and moving
        if (inventory.open || tablet.open) camera.quaternion.copy(frozenLook);
        const on = controls.isLocked && !inventory.open && !tablet.open;
        player.update(dt, {
          forward: on && held(KEYS.forward), back: on && held(KEYS.back),
          left: on && held(KEYS.left), right: on && held(KEYS.right),
          run: on && held(KEYS.run), jump: on && held(KEYS.jump), crouch: on && held(KEYS.crouch),
        });
        grimble?.shakeCamera(camera, dt);
        // what the crosshair is on (or nearest to it) among the things in reach
        focus = on && !player.isDown ? interact.nearest(camera.position, camera.getWorldDirection(viewDir)) : null;
        const armed = on && !player.isDown ? inventory.armed : null;
        const armedHint = armed ? interact.armedPrompt(armed, camera.position) ?? itemHint(armed) : null;
        const parts = [];
        const focusPrompt = focus && interact.prompt(focus);
        if (focusPrompt && !((focus.locked || focus.def.type === 'use') && armedHint)) parts.push(`E · ${focusPrompt}`);
        if (armedHint) parts.push(`Enter · ${armedHint}`);
        if (on && inventory.armed) parts.push('Delete · put away');
        hint.textContent = parts.length ? parts.join('   |   ') : walkHint;
        // the flashlight's battery, while the player has one
        batteryEl.classList.toggle('show', inventory.has('flashlight'));
        if (inventory.has('flashlight')) {
          batteryEl.querySelector('i').style.width = `${Math.round(flashlight.battery * 100)}%`;
          batteryEl.classList.toggle('low', flashlight.battery < 0.15);
          batteryEl.classList.toggle('on', flashlight.on);
        }
      };
      // what Enter does with an item that works anywhere
      function itemHint(id) {
        if (id === 'flashlight') return flashlight.on ? 'Flashlight off' : flashlight.battery > 0 || inventory.has('battery') ? 'Flashlight on' : 'Flashlight (flat)';
        if (id === 'battery') return inventory.has('flashlight') ? 'Put in the flashlight' : null;
        if (id === 'tablet') return 'Open tablet';
        return null;
      }
    }

    const ready = params.get('level') ? viewLevel(params.get('level')) : viewAsset(params.get('asset') || 'lounge_chair');
    // screen-space contact shadows + glow (viewer/fx.js), on unless ?fx=0 or there's no real
    // GPU (software rendering: SwiftShader, llvmpipe; ?fx=1 forces it on anyway); ?q=2|1|0|-1
    // fixes the quality level, otherwise the governor steps it down while the frame rate is low
    let fx = null, govern = () => {};
    const gl = renderer.getContext(), dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const gpuName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '';
    const softwareGPU = /swiftshader|llvmpipe|software/i.test(gpuName);
    ready.then(() => {
      if (params.get('fx') === '1' || (params.get('fx') !== '0' && !softwareGPU)) fx = createFx(renderer, scene, camera, {
        ao: params.get('ao') !== '0', bloom: params.get('glow') !== '0',
        aoScale: +(params.get('aoscale') ?? 4), aoSamples: +(params.get('aosamples') ?? 4), msaa: +(params.get('msaa') ?? 0) });
      if (fx && params.get('q') !== null) fx.setLevel(+params.get('q'));
      else if (fx) govern = governor(fx);
      window.__fx = fx;
      renderer.shadowMap.needsUpdate = true; window.__loaded = true;
    }).catch((e) => (stats.textContent = 'load error: ' + e));

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      fx?.setSize();
    });
    // window.__bench (set by viewer/tools/bench.mjs and shots.mjs) can time each frame and
    // drive the camera after the game's own update; the game never sets it
    renderer.setAnimationLoop(() => {
      // nothing is drawn until the level is in: on a slow GPU each frame drawn during the load
      // (of a half-built scene nobody can play yet) delays the load itself
      if (!window.__loaded) return;
      const b = window.__bench;
      b?.frameStart();
      update();
      b?.drive();
      b?.renderStart();
      govern(performance.now());
      if (fx) fx.render(); else renderer.render(scene, camera);
      b?.frameEnd();
    });
  </script>
</body>
</html>
