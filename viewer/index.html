<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1f22; overflow: hidden; font: 13px system-ui, sans-serif; color: #ccc; }
    #hud { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 6px; }
    #hud a { color: #9cf; margin-right: 8px; }
    #hint { position: absolute; bottom: 14px; width: 100%; text-align: center; color: #eee; text-shadow: 0 1px 3px #000; white-space: pre; }
    #toast { position: absolute; top: 38%; width: 100%; text-align: center; font-size: 17px; color: #fff;
             text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity .25s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #inventory { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 8px; }
    .slot { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.18);
            border-radius: 6px; padding: 6px 10px; color: #eee; }
    .slot .card { width: 22px; height: 14px; border-radius: 2px; background: linear-gradient(90deg, #e9e9e6 72%, #1846a8 72%); }
    .slot .glass { width: 12px; height: 18px; border-radius: 4px 4px 3px 3px; background: linear-gradient(180deg, rgba(190,200,200,.5), rgba(120,115,110,.8)); }
    .slot.armed { border-color: #f0c674; box-shadow: 0 0 0 1px #f0c674 inset; }
    .slot .tag { font-size: 10px; letter-spacing: .08em; color: #f0c674; }
    #inv-panel { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,12,14,.55); }
    #inv-panel.open { display: flex; }
    #inv-panel .box { min-width: 320px; background: rgba(20,22,25,.92); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 18px 20px; }
    #inv-panel h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .14em; color: #aaa; font-weight: 600; }
    #inv-panel .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px; color: #ddd; font-size: 15px; }
    #inv-panel .row.sel { background: rgba(240,198,116,.16); color: #fff; outline: 1px solid rgba(240,198,116,.6); }
    #inv-panel .row .tag { margin-left: auto; font-size: 11px; color: #f0c674; letter-spacing: .08em; }
    #inv-panel .empty { color: #888; padding: 8px 2px; }
    #inv-panel .help { margin-top: 14px; font-size: 12px; color: #999; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="hud">
    <a href="?level=mansion">mansion</a>
    <a href="?asset=lounge_chair">lounge_chair</a>
    <a href="?asset=desk_chair">desk_chair</a>
    <a href="?asset=desk">desk</a>
    <a href="?asset=coffee_table">coffee_table</a>
    <a href="?asset=rug">rug</a>
    <span id="stats"></span>
  </div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="inventory"></div>
  <div id="inv-panel"><div class="box"><h2>INVENTORY</h2><div id="inv-list"></div>
    <div class="help">↑ ↓ · choose &nbsp;&nbsp; Enter · arm &nbsp;&nbsp; I · close</div></div></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
    import { Interactables, Inventory } from './interactables.js';
    import { loadBake } from './baked.js';
    import { Player, KEYS } from './player.js';
    import { Hand, Throwables } from './items.js';

    const params = new URLSearchParams(location.search);
    const stats = document.getElementById('stats');
    const hint = document.getElementById('hint');

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    // cap the render resolution: retina screens would otherwise draw 4x the pixels
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // nothing casts moving shadows except interactables, so only redraw shadows on demand
    renderer.shadowMap.autoUpdate = false;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const envMap = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = envMap;
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 200);
    const loader = new GLTFLoader();
    const loadGltf = (url) => new Promise((ok, fail) => loader.load(url, ok, undefined, fail));

    // assets that use the same image (e.g. walnut) share one GPU texture
    const textureCache = new Map();
    function shareTextures(m) {
      for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap']) {
        const t = m[k];
        if (!t || !t.name) continue;
        const key = `${t.name}:${t.image?.width}x${t.image?.height}`;
        if (!textureCache.has(key)) textureCache.set(key, t);
        else if (textureCache.get(key) !== t) { t.dispose(); m[k] = textureCache.get(key); }
      }
    }

    function prepare(root, envIntensity = 1) {
      let tris = 0, meshes = 0;
      root.traverse((o) => {
        if (!o.isMesh) return;
        meshes++;
        shareTextures(o.material);
        tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
        const m = o.material;
        m.envMapIntensity = envIntensity;
        if (m.transparent) { o.castShadow = false; o.receiveShadow = false; m.depthWrite = false; }
        else { o.castShadow = o.receiveShadow = true; }
      });
      return { tris, meshes };
    }

    let update = () => {};
    window.__camera = camera;
    window.__three = { renderer, scene, camera };

    // ------------------------------------------------------------ single asset
    async function viewAsset(name) {
      scene.background = new THREE.Color(0x1d1f22);
      camera.fov = 40; camera.updateProjectionMatrix();
      camera.position.set(1.4, 1.1, 1.8);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.4, 0);
      controls.enableDamping = true;
      update = () => controls.update();

      const sun = new THREE.DirectionalLight(0xffffff, 2.0);
      sun.position.set(2, 4, 3);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 });
      sun.shadow.bias = -0.0005;
      scene.add(sun);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20),
        new THREE.MeshStandardMaterial({ color: 0x8a8580, roughness: 0.9 }));
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const gltf = await loadGltf(`../assets/models/${name}.gltf`);
      const { tris, meshes } = prepare(gltf.scene);
      scene.add(gltf.scene);
      const size = new THREE.Box3().setFromObject(gltf.scene).getSize(new THREE.Vector3());
      stats.textContent = `${meshes} meshes · ${Math.round(tris)} tris · ${size.x.toFixed(2)}×${size.z.toFixed(2)}×${size.y.toFixed(2)} m`;
    }

    // ------------------------------------------------------------ level
    async function viewLevel(name) {
      const base = '../assets/';
      const level = await (await fetch(`${base}levels/${name}.json`)).json();
      scene.background = new THREE.Color(0xb9cde3);
      RectAreaLightUniformsLib.init();

      // baked lighting replaces the stand-in fill lights; the sun stays real-time
      const baked = params.get('bake') === '0' ? null : await loadBake(base, name, renderer);
      if (baked) {
        scene.environment = baked.defaultEnv;
        renderer.toneMappingExposure = baked.bake.exposure;
      }
      const env = level.lights.find((l) => l.type === 'ambient_env');
      const envIntensity = baked ? 1 : env ? env.intensity : 1;
      for (const l of level.lights) {
        if (baked && l.type !== 'sun') continue;
        if (l.type === 'rect') {
          const light = new THREE.RectAreaLight(new THREE.Color(...l.color), l.intensity, l.width, l.height);
          light.position.set(...l.position);
          light.lookAt(...l.lookAt);
          scene.add(light);
        } else if (l.type === 'hemisphere') {
          scene.add(new THREE.HemisphereLight(new THREE.Color(...l.sky), new THREE.Color(...l.ground), l.intensity));
        } else if (l.type === 'sun') {
          const sun = new THREE.DirectionalLight(new THREE.Color(...l.color), l.intensity);
          const dir = new THREE.Vector3(...l.direction).normalize();
          // the shadow must cover the whole level: walls and ceilings are what keep the
          // sun out of interior rooms, so a prop outside the shadow box is lit as if outdoors
          const bounds = new THREE.Box3();
          for (const c of level.colliders) bounds.union(new THREE.Box3(new THREE.Vector3(...c.min), new THREE.Vector3(...c.max)));
          const centre = bounds.getCenter(new THREE.Vector3());
          const radius = bounds.getSize(new THREE.Vector3()).length() / 2;
          sun.target.position.copy(centre);
          sun.position.copy(centre).addScaledVector(dir, -(radius + 5));
          sun.castShadow = true;
          sun.shadow.mapSize.set(2048, 2048);
          Object.assign(sun.shadow.camera, { left: -radius, right: radius, top: radius, bottom: -radius, near: 1, far: 2 * radius + 10 });
          sun.shadow.bias = -0.0004;
          sun.shadow.normalBias = 0.02;
          scene.add(sun, sun.target);
        }
      }

      // load each asset once, clone per placement (geometry + materials shared)
      const names = [...new Set(level.props.map((p) => p.asset))];
      const [shell, ...protos] = await Promise.all(
        [level.shell, ...names.map((n) => level.assets[n].file)].map((f) => loadGltf(base + f)));
      let total = prepare(shell.scene, envIntensity).tris;
      if (baked) baked.applyLightmaps(shell.scene);
      scene.add(shell.scene);
      const proto = Object.fromEntries(names.map((n, i) => [n, protos[i].scene]));
      for (const n of names) prepare(proto[n], envIntensity);

      const colliders = level.colliders.map((c) => new THREE.Box3(new THREE.Vector3(...c.min), new THREE.Vector3(...c.max)));
      const inventoryEl = document.getElementById('inventory');
      const invPanel = document.getElementById('inv-panel');
      const invList = document.getElementById('inv-list');
      const icon = (id) => (id === 'keycard' ? '<span class="card"></span>' : id === 'vase' ? '<span class="glass"></span>' : '');
      const inventory = new Inventory((inv) => {
        inventoryEl.innerHTML = [...inv.items].map(([id, it]) =>
          `<div class="slot${inv.armed === id ? ' armed' : ''}">${icon(id)}${it.name}${inv.armed === id ? ' <span class="tag">ARMED</span>' : ''}</div>`).join('');
        invPanel.classList.toggle('open', inv.open);
        invList.innerHTML = inv.items.size
          ? inv.ids().map((id, i) => `<div class="row${i === inv.sel ? ' sel' : ''}">${icon(id)}${inv.name(id)}${inv.armed === id ? '<span class="tag">ARMED</span>' : ''}</div>`).join('')
          : '<div class="empty">Nothing yet.</div>';
        hand?.show(inv.armed, inv.armed && inv.get(inv.armed).node);
      });
      let hand = null;
      const interact = new Interactables(inventory, colliders);
      window.__interact = interact;
      window.__inventory = inventory;
      const placed = {};   // asset -> first placed object, for attachments
      for (const p of level.props) {
        const obj = proto[p.asset].clone(true);
        obj.position.set(...p.position);
        obj.rotation.y = THREE.MathUtils.degToRad(p.rotationY);
        if (baked) baked.applyRoom(obj, p.room);
        if (p.attach) {
          // e.g. the keycard rides inside the desk drawer
          placed[p.attach.asset].getObjectByName(p.attach.node).add(obj);
          interact.collect(obj, { lock: p.lock });
          total += level.assets[p.asset].tris;
          continue;
        }
        scene.add(obj);
        placed[p.asset] ??= obj;
        obj.updateMatrixWorld(true);
        interact.collect(obj, { lock: p.lock });
        total += level.assets[p.asset].tris;
        // one box per part (seat, desktop, ...) so the player can stand on them
        const a = level.assets[p.asset];
        for (const c of a.colliders || [a.aabb])
          colliders.push(new THREE.Box3(new THREE.Vector3(...c.min), new THREE.Vector3(...c.max)).applyMatrix4(obj.matrixWorld));
      }
      stats.textContent = `${level.props.length} props · ${Math.round(total)} tris · ${colliders.length} colliders`;

      camera.fov = 65; camera.updateProjectionMatrix();
      // ?pos=x,y,z&look=x,y,z overrides the spawn view (pos is eye position; handy for screenshots)
      const vec = (k, d) => (params.get(k) ? params.get(k).split(',').map(Number) : d);
      const eyePos = vec('pos', level.spawn.position);
      camera.position.set(...eyePos);
      camera.lookAt(...vec('look', level.spawn.lookAt));
      const player = new Player(camera, colliders, [eyePos[0], eyePos[1] - 1.65, eyePos[2]]);
      window.__player = player;
      scene.add(camera);                       // so the held item (a child of the camera) renders
      hand = new Hand(camera);
      const throwables = new Throwables(scene, colliders, () => toast('Smash!'));
      window.__throwables = throwables;

      const controls = new PointerLockControls(camera, document.body);
      const walkHint = 'click to play · WASD move · Shift run · Space jump · C crouch · I inventory · Esc release';
      hint.textContent = walkHint;
      document.body.addEventListener('click', () => controls.lock());
      const keys = {};
      let focus = null;   // interactable the player can use right now
      addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        if (!controls.isLocked || e.repeat) return;
        if (e.code === 'KeyI') { inventory.toggle(); if (inventory.open) frozenLook.copy(camera.quaternion); return; }
        // with the inventory open, the up/down arrows step through it (movement is paused then)
        if (inventory.open && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
          inventory.move(e.code === 'ArrowDown' ? 1 : -1);
          return;
        }
        if (e.code === 'Enter' || e.code === 'NumpadEnter') {
          if (inventory.open) {
            const id = inventory.armSelected();
            if (id) toast(`Armed: ${inventory.name(id)} · Enter to use · Delete to put away`);
          } else if (inventory.armed) useArmed();
          return;
        }
        // Mac keyboards send Backspace for the key labelled "delete"
        if ((e.code === 'Delete' || e.code === 'Backspace') && inventory.armed) {
          e.preventDefault();
          toast(`${inventory.name(inventory.holster())} put away`);
          return;
        }
        if (e.code === 'KeyE' && focus && !inventory.open) {
          const msg = interact.use(focus, player.boxAt(player.pos).clone());
          if (msg) toast(msg);
          renderer.shadowMap.needsUpdate = true;
        }
      });
      const frozenLook = new THREE.Quaternion();

      function useArmed() {
        const id = inventory.armed;
        const entry = inventory.get(id);
        if (entry.def.throwable) {
          const dir = new THREE.Vector3();
          camera.getWorldDirection(dir);
          const origin = camera.position.clone().addScaledVector(dir, 0.45).add(new THREE.Vector3(0, -0.15, 0));
          throwables.throw(entry.node, origin, dir);
          inventory.remove(id);
          return;
        }
        toast(interact.useKey(id, camera.position));
      }
      addEventListener('keyup', (e) => (keys[e.code] = false));
      const releaseAll = () => { for (const k in keys) keys[k] = false; };
      addEventListener('blur', releaseAll);
      controls.addEventListener('unlock', () => { releaseAll(); if (inventory.open) inventory.toggle(); });
      const held = (names) => names.some((k) => keys[k]);
      const toastEl = document.getElementById('toast');
      let toastTimer;
      const toast = (msg) => {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
      };
      window.__toast = () => toastEl.textContent;

      const clock = new THREE.Clock();
      update = () => {
        const dt = Math.min(clock.getDelta(), 0.05);
        const moved = interact.update(dt);
        if (moved.length) renderer.shadowMap.needsUpdate = true;
        // a door that has just finished opening may now overlap the player: step them clear
        for (const it of moved) if (it.collider && it.t === it.target) player.pushOutOf(it.collider);
        if (throwables.update(dt)) renderer.shadowMap.needsUpdate = true;
        if (inventory.open) camera.quaternion.copy(frozenLook);   // the inventory screen pauses looking and moving
        const on = controls.isLocked && !inventory.open;
        player.update(dt, {
          forward: on && held(KEYS.forward), back: on && held(KEYS.back),
          left: on && held(KEYS.left), right: on && held(KEYS.right),
          run: on && held(KEYS.run), jump: on && held(KEYS.jump), crouch: on && held(KEYS.crouch),
        });
        focus = on ? interact.nearest(camera.position) : null;
        const armedHint = on && inventory.armed ? interact.armedPrompt(inventory.armed, camera.position) : null;
        const parts = [];
        if (focus && !(focus.locked && armedHint)) parts.push(`E · ${interact.prompt(focus)}`);
        if (armedHint) parts.push(`Enter · ${armedHint}`);
        if (on && inventory.armed) parts.push('Delete · put away');
        hint.textContent = parts.length ? parts.join('   |   ') : walkHint;
      };
    }

    const ready = params.get('level') ? viewLevel(params.get('level')) : viewAsset(params.get('asset') || 'lounge_chair');
    ready.then(() => { renderer.shadowMap.needsUpdate = true; window.__loaded = true; }).catch((e) => (stats.textContent = 'load error: ' + e));

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.setAnimationLoop(() => { update(); renderer.render(scene, camera); });
  </script>
</body>
</html>
