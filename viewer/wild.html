<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurel Fork Cove</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1f22; overflow: hidden; font: 13px system-ui, sans-serif; color: #ccc; }
    #hud { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 6px; }
    #overlay { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 6px;
               font: 12px ui-monospace, Menlo, monospace; white-space: pre; color: #e6e6e6; pointer-events: none; }
    canvas { display: block; }
    /* [river] being in the water (viewer/wild/swim.js): under the surface, air left, a wipeout's dark */
    #underwater { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .12s;
                  background: radial-gradient(ellipse at 50% 40%, rgba(38,74,58,.55), rgba(8,22,18,.88)); }
    #breath { position: absolute; bottom: 48px; left: 50%; width: 160px; margin-left: -80px; height: 5px; border-radius: 3px;
              background: rgba(0,0,0,.4); opacity: 0; transition: opacity .3s; pointer-events: none; }
    #breath-bar { height: 100%; border-radius: 3px; background: #cfe6f0; transform-origin: left; }
    #wipeout { position: absolute; inset: 0; background: #020404; opacity: 0; pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="underwater"></div><div id="breath"><div id="breath-bar"></div></div><div id="wipeout"></div>
  <div id="overlay"></div>
  <div id="hud">loading...</div>
  <script>window.WILD_WORLD = new URLSearchParams(location.search).get("world") || "laurel_fork";</script>
  <script type="module" src="./wild/main.js"></script>
</body>
</html>
