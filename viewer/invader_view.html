<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invader viewer</title>
  <style>
    :root { --bg: #23252a; --panel: rgba(20, 21, 24, 0.86); --fg: #e6e2d8; --dim: #a19c90; --acc: #d9b46a; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #ui { position: absolute; top: 8px; left: 8px; width: 270px; max-height: calc(100% - 16px); overflow-y: auto;
          background: var(--panel); border-radius: 6px; padding: 8px 10px; box-sizing: border-box; }
    #ui h3 { margin: 8px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
    #ui .row { display: flex; flex-wrap: wrap; gap: 4px; }
    #ui button { background: #34363c; color: var(--fg); border: 0; border-radius: 4px; padding: 3px 7px; font: inherit; font-size: 12px; cursor: pointer; }
    #ui button.on { background: var(--acc); color: #1b1b1b; }
    #ui label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
    #stats { position: absolute; right: 8px; top: 8px; background: var(--panel); border-radius: 6px; padding: 6px 9px; font: 12px ui-monospace, monospace; white-space: pre; }
    @media (max-width: 640px) { #ui { width: calc(100% - 32px); max-height: 45%; left: 16px; } #stats { display: none; } }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="ui"></div>
  <div id="stats">loading</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { InvaderAsset } from './invader_asset.js';

    // ?clip=Walk&outfit=Navy&head=cap&weapon=Rifle&lod=1&view=side&t=0.3 (t: freeze at that time)
    // &upper=AimRifle (layered over clip), &crowd=50 (the bone-texture crowd demo), &axes=1 (sockets)
    const Q = new URLSearchParams(location.search);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.AgXToneMapping;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3a3d44);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.8;
    const sun = new THREE.DirectionalLight(0xfff1dd, 2.2);
    sun.position.set(3, 6, 4);
    scene.add(sun, new THREE.HemisphereLight(0xbfd4ff, 0x3a3328, 0.6));
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 400);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    camera.position.set(1.8, 1.5, 4.2);
    controls.update();

    // floor: a grid that scrolls at the clip's speed under in-place locomotion (planted feet stay put)
    const gridTex = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d'); g.fillStyle = '#55585f'; g.fillRect(0, 0, 256, 256);
      g.strokeStyle = '#6c7078'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
      g.strokeStyle = '#61646b'; g.lineWidth = 1; g.beginPath(); g.moveTo(128, 0); g.lineTo(128, 256); g.moveTo(0, 128); g.lineTo(256, 128); g.stroke();
      const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40);
      t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
    })();
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: gridTex, roughness: 0.95 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const loader = new GLTFLoader();
    loader.setDRACOLoader(new DRACOLoader().setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/'));
    const asset = await InvaderAsset.load(loader, '../assets/models/invader.gltf');
    await asset.preloadOutfits();
    const meta = asset.meta;
    const inv = asset.spawn({ outfit: Q.get('outfit') || undefined, head: Q.get('head') || 'none', weapon: Q.get('weapon') || null,
                              lod: Q.has('lod') ? +Q.get('lod') : 0 });
    scene.add(inv.root);
    const skel = new THREE.SkeletonHelper(inv.root);
    skel.visible = Q.get('skel') === '1';
    scene.add(skel);
    const axes = [];
    inv.root.traverse((o) => {
      if (/^Socket_|_Muzzle$|_Tip$/.test(o.name)) { const a = new THREE.AxesHelper(0.12); a.visible = Q.get('axes') === '1'; o.add(a); axes.push(a); }
    });

    const state = { clip: Q.get('clip') || 'Idle', upper: Q.get('upper') || null, speed: 1, scroll: true, freeze: Q.has('t') ? +Q.get('t') : null };
    const speeds = {};   // clip -> m/s of the in-place locomotion (from the root's userData)
    for (const k of Object.keys(meta)) {
      const m = k.match(/^(.*)Speed$/);
      if (m) speeds[m[1][0].toUpperCase() + m[1].slice(1)] = meta[k];
    }
    if (meta.dragSpeed) speeds.Drag = -meta.dragSpeed;

    function play(name, upper = state.upper) {
      state.clip = name;
      state.upper = upper;
      if (upper) { inv.play(name); inv.play(upper, { upper: true, lower: name, fade: 0 }); }
      else inv.play(name, { fade: 0.2 });
      if (inv.current) inv.current.timeScale = state.speed;
      refreshUI();
    }

    // deterministic pose for screenshots: clip at time t (s), no blending
    function pose(name, t, upper = null) {
      inv.mixer.stopAllAction();
      inv.current = null;
      play(name, upper);
      inv.current.stop(); inv.current.reset().play();
      inv.current.time = t;
      inv.mixer.update(0);
      state.freeze = t;
    }

    // ---- UI
    const ui = document.getElementById('ui');
    function section(title, items, isOn, onClick) {
      const h = document.createElement('h3'); h.textContent = title; ui.appendChild(h);
      const row = document.createElement('div'); row.className = 'row'; ui.appendChild(row);
      for (const it of items) {
        const b = document.createElement('button'); b.textContent = it; b.className = isOn(it) ? 'on' : '';
        b.onclick = () => onClick(it); row.appendChild(b);
      }
    }
    function refreshUI() {
      ui.innerHTML = '';
      const clips = Object.keys(asset.clips);
      section('Clips', clips, (c) => c === state.clip, (c) => { state.freeze = null; play(c); });
      const uppers = ['none', ...clips.filter((c) => /^(Hold|Aim)/.test(c))];
      section('Upper-body layer', uppers, (c) => (state.upper || 'none') === c, (c) => { state.freeze = null; play(state.clip, c === 'none' ? null : c); });
      section('Outfit', (meta.outfits || []).map((o) => o.name), (o) => o === inv.outfit, (o) => { inv.setOutfit(o); refreshUI(); });
      section('Head', ['none', 'mask', 'cap', 'hood', 'mask+cap', 'mask+hood'], (h) => h === inv.head, (h) => { inv.setHead(h); refreshUI(); });
      section('Weapon', ['none', 'Rifle', 'Pistol', 'Bat', 'Knife'], (w) => (inv.weapon || 'none') === w, (w) => { inv.setWeapon(w === 'none' ? null : w); refreshUI(); });
      section('LOD', ['auto', '0', '1', '2'], (l) => String(inv.forcedLod ?? 'auto') === l, (l) => { inv.forcedLod = l === 'auto' ? null : +l; if (l !== 'auto') inv.setLod(+l); refreshUI(); });
      section('Speed', ['0.25', '0.5', '1'], (s) => +s === state.speed, (s) => { state.speed = +s; if (inv.current) inv.current.timeScale = +s; refreshUI(); });
      section('Show', ['skeleton', 'sockets', 'scroll floor'], (s) => (s === 'skeleton' ? skel.visible : s === 'sockets' ? axes[0]?.visible : state.scroll),
        (s) => { if (s === 'skeleton') skel.visible = !skel.visible; else if (s === 'sockets') axes.forEach((a) => (a.visible = !a.visible)); else state.scroll = !state.scroll; refreshUI(); });
      section('View', ['front', 'side', 'back', 'three', 'head', 'hands', 'feet'], () => false, (v) => view(v));
    }

    const VIEWS = {
      front: [[0, 1.0, 4.4], [0, 0.95, 0]], side: [[4.4, 1.0, 0], [0, 0.95, 0]], back: [[0, 1.0, -4.4], [0, 0.95, 0]],
      three: [[2.4, 1.5, 3.6], [0, 0.95, 0]], head: [[0.35, 1.72, 0.75], [0, 1.66, 0]], hands: [[0.9, 1.0, 1.2], [0, 0.95, 0]],
      feet: [[1.2, 0.35, 1.3], [0, 0.15, 0]], far: [[6, 3, 14], [0, 0.9, 0]],
    };
    function view(v) {
      const [p, t] = VIEWS[v] || VIEWS.three;
      camera.position.set(...p); controls.target.set(...t); controls.update();
    }
    view(Q.get('view') || 'three');

    // ---- crowd demo hook (the bone-animation texture path, viewer/invader_crowd.js)
    let crowd = null;
    if (Q.get('crowd')) {
      const { InvaderCrowd } = await import('./invader_crowd.js');
      crowd = await InvaderCrowd.load(asset, '../assets/models/invader_anim.json', { lod: +(Q.get('crowdlod') || 1) });
      crowd.spawnGrid(+Q.get('crowd'), 1.6);
      scene.add(crowd.mesh);
      inv.root.visible = Q.get('hero') === '1';
      view('far');
    }

    play(state.clip, state.upper);
    if (state.freeze !== null) pose(state.clip, state.freeze, state.upper);

    window.__inv = {
      inv, asset, meta, scene, camera, renderer, crowd,
      clips: Object.keys(asset.clips), pose, play, view,
      setLod: (i) => { inv.forcedLod = i; inv.setLod(i); },
      info: () => ({ tris: inv.lods.map((o) => o.geometry.index.count / 3), joints: inv.lods[0].skeleton.bones.map((b) => b.name),
                     clips: Object.fromEntries(Object.entries(asset.clips).map(([k, c]) => [k, +c.duration.toFixed(3)])), userData: meta }),
    };

    const stats = document.getElementById('stats');
    const clock = new THREE.Clock();
    let frames = 0, acc = 0;
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (state.freeze === null) inv.update(dt);
      if (crowd) crowd.update(window.__bench ? 0 : dt);
      const v = speeds[state.clip] || 0;
      if (state.scroll && state.freeze === null) gridTex.offset.y -= (v * dt * state.speed) / 1.0 * (40 / 40);
      controls.update();
      renderer.render(scene, camera);
      frames++; acc += dt;
      if (acc > 0.5) {
        stats.textContent = `${state.clip}${state.upper ? ' | ' + state.upper : ''}  t ${(inv.current?.time ?? 0).toFixed(2)}\n` +
          `LOD${inv.lod} ${inv.lods[inv.lod]?.geometry.index.count / 3} tris  ${(frames / acc).toFixed(0)} fps\n` +
          `calls ${renderer.info.render.calls}  tris ${renderer.info.render.triangles}`;
        frames = 0; acc = 0;
      }
      requestAnimationFrame(frame);
    }
    window.__loaded = true;
    frame();
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
</html>
